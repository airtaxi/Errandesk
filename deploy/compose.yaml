# Runs Errandesk with MongoDB. Copy .env.example to .env, fill in the required values, then run:
#   docker compose up -d --build
name: errandesk

services:
  mongodb:
    image: mongo:9
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: errandesk-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${ERRANDESK_PUBLISHED_PORT:-8080}:${ERRANDESK_HTTP_PORT:-8080}"

volumes:
  mongodb-data:
